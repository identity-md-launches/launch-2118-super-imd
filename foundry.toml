[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned compiler: the launch verifier carries exactly this version offline.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The launch compares deployed bytes without a metadata hash, so the build must not embed one.
bytecode_hash = "none"
cbor_metadata = false

# No foreign function interface and no filesystem access from tests or scripts.
ffi = false
fs_permissions = []

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
